name = "algo-cleanse"
main = "src/index.ts"
compatibility_date = "2024-09-23"

rules = [
  { type = "Text", globs = ["**/*.md"], fallthrough = true }
]

[[d1_databases]]
binding = "DB"
database_name = "algo-cleanse"
database_id = "D1_DATABASE_ID_PLACEHOLDER"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

