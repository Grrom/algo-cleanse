<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YouTube Watch Sidebar Fixture</title>
  </head>
  <body>
    <ytd-app>
      <div id="content">
        <ytd-watch-flexy>
          <div id="columns">
            <div id="secondary" class="style-scope ytd-watch-flexy">
              <div id="secondary-inner" class="style-scope ytd-watch-flexy">
                <ytd-item-section-renderer>
                  <div id="contents">
                    <!-- Sidebar Video Tile 1 -->
                    <ytd-compact-video-renderer
                      class="style-scope ytd-item-section-renderer"
                    >
                      <div
                        id="dismissible"
                        class="style-scope ytd-compact-video-renderer"
                      >
                        <a
                          id="thumbnail"
                          class="yt-simple-endpoint inline-block style-scope ytd-thumbnail"
                          href="/watch?v=sidebarVid001"
                        >
                          <span
                            class="ytd-thumbnail-overlay-time-status-renderer"
                            >11:58</span
                          >
                        </a>
                        <div
                          class="details style-scope ytd-compact-video-renderer"
                        >
                          <div
                            class="metadata style-scope ytd-compact-video-renderer"
                          >
                            <a
                              class="yt-simple-endpoint style-scope ytd-compact-video-renderer"
                              href="/watch?v=sidebarVid001"
                            >
                              <h3
                                class="style-scope ytd-compact-video-renderer"
                              >
                                <span
                                  id="video-title"
                                  class="style-scope ytd-compact-video-renderer"
                                  title="Next-Level Algorithms You Must Know"
                                >
                                  Next-Level Algorithms You Must Know
                                </span>
                              </h3>
                            </a>
                            <div
                              id="channel-info"
                              class="style-scope ytd-compact-video-renderer"
                            >
                              <ytd-channel-name id="channel-name">
                                <div id="container">
                                  <div id="text-container">
                                    <yt-formatted-string
                                      id="text"
                                      title="Algo King"
                                    >
                                      <a
                                        class="yt-simple-endpoint style-scope yt-formatted-string"
                                        href="/@AlgoKing"
                                        >Algo King</a
                                      >
                                    </yt-formatted-string>
                                  </div>
                                </div>
                              </ytd-channel-name>
                            </div>
                          </div>
                          <div id="menu">
                            <ytd-menu-renderer>
                              <button aria-label="Action menu">⋮</button>
                            </ytd-menu-renderer>
                          </div>
                        </div>
                      </div>
                    </ytd-compact-video-renderer>

                    <!-- Sidebar Video Tile 2 -->
                    <ytd-compact-video-renderer
                      class="style-scope ytd-item-section-renderer"
                    >
                      <div
                        id="dismissible"
                        class="style-scope ytd-compact-video-renderer"
                      >
                        <a
                          id="thumbnail"
                          class="yt-simple-endpoint inline-block style-scope ytd-thumbnail"
                          href="/watch?v=sidebarVid002"
                        >
                          <span
                            class="ytd-thumbnail-overlay-time-status-renderer"
                            >16:40</span
                          >
                        </a>
                        <div
                          class="details style-scope ytd-compact-video-renderer"
                        >
                          <div
                            class="metadata style-scope ytd-compact-video-renderer"
                          >
                            <a
                              class="yt-simple-endpoint style-scope ytd-compact-video-renderer"
                              href="/watch?v=sidebarVid002"
                            >
                              <h3
                                class="style-scope ytd-compact-video-renderer"
                              >
                                <span
                                  id="video-title"
                                  class="style-scope ytd-compact-video-renderer"
                                  title="CSS Grid and Flexbox Complete Guide"
                                >
                                  CSS Grid and Flexbox Complete Guide
                                </span>
                              </h3>
                            </a>
                            <div
                              id="channel-info"
                              class="style-scope ytd-compact-video-renderer"
                            >
                              <ytd-channel-name id="channel-name">
                                <div id="container">
                                  <div id="text-container">
                                    <yt-formatted-string
                                      id="text"
                                      title="CSS Tricks Daily"
                                    >
                                      <a
                                        class="yt-simple-endpoint style-scope yt-formatted-string"
                                        href="/@CSSTricksDaily"
                                        >CSS Tricks Daily</a
                                      >
                                    </yt-formatted-string>
                                  </div>
                                </div>
                              </ytd-channel-name>
                            </div>
                          </div>
                          <div id="menu">
                            <ytd-menu-renderer>
                              <button aria-label="More actions">⋮</button>
                            </ytd-menu-renderer>
                          </div>
                        </div>
                      </div>
                    </ytd-compact-video-renderer>
                  </div>
                </ytd-item-section-renderer>
              </div>
            </div>
          </div>
        </ytd-watch-flexy>
      </div>
    </ytd-app>
  </body>
</html>
