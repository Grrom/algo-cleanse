<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YouTube Home Grid Fixture</title>
  </head>
  <body>
    <ytd-app>
      <div id="content">
        <ytd-page-manager>
          <ytd-browse>
            <ytd-two-column-browse-results-renderer>
              <div id="primary">
                <ytd-rich-grid-renderer>
                  <div id="contents">
                    <!-- Video Tile 1: Standard Rich Item Renderer -->
                    <ytd-rich-item-renderer
                      class="style-scope ytd-rich-grid-row"
                    >
                      <div id="content">
                        <ytd-rich-grid-media>
                          <div id="thumbnail">
                            <a
                              id="thumbnail"
                              class="yt-simple-endpoint inline-block style-scope ytd-thumbnail"
                              href="/watch?v=homeVid001"
                            >
                              <span
                                class="ytd-thumbnail-overlay-time-status-renderer"
                                >14:20</span
                              >
                            </a>
                          </div>
                          <div id="details">
                            <div id="meta">
                              <h3 class="style-scope ytd-rich-grid-media">
                                <a
                                  id="video-title-link"
                                  class="yt-simple-endpoint style-scope ytd-rich-grid-media"
                                  title="Building a Modern Extension from Scratch"
                                  href="/watch?v=homeVid001"
                                >
                                  <yt-formatted-string id="video-title"
                                    >Building a Modern Extension from
                                    Scratch</yt-formatted-string
                                  >
                                </a>
                              </h3>
                              <div id="channel-info">
                                <ytd-channel-name id="channel-name">
                                  <div id="container">
                                    <div id="text-container">
                                      <yt-formatted-string
                                        id="text"
                                        title="Dev Mastery"
                                      >
                                        <a
                                          class="yt-simple-endpoint style-scope yt-formatted-string"
                                          href="/@DevMastery"
                                          >Dev Mastery</a
                                        >
                                      </yt-formatted-string>
                                    </div>
                                  </div>
                                </ytd-channel-name>
                              </div>
                            </div>
                            <div id="menu">
                              <ytd-menu-renderer>
                                <yt-icon-button id="button">
                                  <button aria-label="Action menu">⋮</button>
                                </yt-icon-button>
                              </ytd-menu-renderer>
                            </div>
                          </div>
                        </ytd-rich-grid-media>
                      </div>
                    </ytd-rich-item-renderer>

                    <!-- Video Tile 2: Lockup View Model Inside Rich Item Renderer -->
                    <ytd-rich-item-renderer
                      class="style-scope ytd-rich-grid-row"
                    >
                      <yt-lockup-view-model class="yt-lockup-view-model-wiz">
                        <div class="yt-lockup-view-model-wiz__content-image">
                          <a
                            href="/watch?v=homeVid002"
                            class="yt-lockup-view-model-wiz__content-image"
                          >
                            <div class="badge-shape-wiz__text">21:05</div>
                          </a>
                        </div>
                        <div class="yt-lockup-view-model-wiz__metadata">
                          <h3 class="yt-lockup-view-model-wiz__title">
                            <a
                              href="/watch?v=homeVid002"
                              title="Why Clean Architecture Matters in 2026"
                            >
                              <span
                                >Why Clean Architecture Matters in 2026</span
                              >
                            </a>
                          </h3>
                          <div class="yt-lockup-view-model-wiz__subhead">
                            <a href="/@ArchitectureLab">Architecture Lab</a>
                          </div>
                          <div class="yt-lockup-view-model-wiz__menu">
                            <button aria-label="More actions">⋮</button>
                          </div>
                        </div>
                      </yt-lockup-view-model>
                    </ytd-rich-item-renderer>

                    <!-- Video Tile 3: Standalone Grid Video Renderer -->
                    <ytd-grid-video-renderer
                      class="style-scope ytd-grid-renderer"
                    >
                      <div
                        id="dismissible"
                        class="style-scope ytd-grid-video-renderer"
                      >
                        <div id="thumbnail">
                          <a
                            id="thumbnail"
                            class="yt-simple-endpoint inline-block style-scope ytd-thumbnail"
                            href="/watch?v=homeVid003"
                          >
                            <span
                              class="ytd-thumbnail-overlay-time-status-renderer"
                              >09:42</span
                            >
                          </a>
                        </div>
                        <div id="details">
                          <h3 class="style-scope ytd-grid-video-renderer">
                            <a
                              id="video-title"
                              class="yt-simple-endpoint style-scope ytd-grid-video-renderer"
                              title="Understanding React 19 and Web Components"
                              href="/watch?v=homeVid003"
                            >
                              Understanding React 19 and Web Components
                            </a>
                          </h3>
                          <div id="channel-info">
                            <ytd-channel-name id="channel-name">
                              <div id="container">
                                <div id="text-container">
                                  <yt-formatted-string
                                    id="text"
                                    title="Frontend Guru"
                                  >
                                    <a
                                      class="yt-simple-endpoint style-scope yt-formatted-string"
                                      href="/@FrontendGuru"
                                      >Frontend Guru</a
                                    >
                                  </yt-formatted-string>
                                </div>
                              </div>
                            </ytd-channel-name>
                          </div>
                        </div>
                      </div>
                    </ytd-grid-video-renderer>
                  </div>
                </ytd-rich-grid-renderer>
              </div>
            </ytd-two-column-browse-results-renderer>
          </ytd-browse>
        </ytd-page-manager>
      </div>
    </ytd-app>
  </body>
</html>
