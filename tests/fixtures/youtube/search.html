<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YouTube Search Results Fixture</title>
  </head>
  <body>
    <ytd-app>
      <div id="content">
        <ytd-search>
          <div id="container">
            <ytd-two-column-search-results-renderer>
              <div id="primary">
                <ytd-section-list-renderer>
                  <div id="contents">
                    <ytd-item-section-renderer>
                      <div id="contents">
                        <!-- Search Video Tile 1 -->
                        <ytd-video-renderer
                          class="style-scope ytd-item-section-renderer"
                        >
                          <div
                            id="dismissible"
                            class="style-scope ytd-video-renderer"
                          >
                            <ytd-thumbnail
                              class="style-scope ytd-video-renderer"
                            >
                              <a
                                id="thumbnail"
                                class="yt-simple-endpoint inline-block style-scope ytd-thumbnail"
                                href="/watch?v=searchVid001"
                              >
                                <span
                                  class="ytd-thumbnail-overlay-time-status-renderer"
                                  >45:12</span
                                >
                              </a>
                            </ytd-thumbnail>
                            <div
                              class="text-wrapper style-scope ytd-video-renderer"
                            >
                              <div id="meta">
                                <div id="title-wrapper">
                                  <h3
                                    class="title-and-badge style-scope ytd-video-renderer"
                                  >
                                    <a
                                      id="video-title"
                                      class="yt-simple-endpoint style-scope ytd-video-renderer"
                                      title="Full TypeScript Masterclass for Beginners"
                                      href="/watch?v=searchVid001"
                                    >
                                      Full TypeScript Masterclass for Beginners
                                    </a>
                                  </h3>
                                </div>
                                <div
                                  id="channel-info"
                                  class="style-scope ytd-video-renderer"
                                >
                                  <ytd-channel-name
                                    id="channel-name"
                                    class="style-scope ytd-video-renderer"
                                  >
                                    <div id="container">
                                      <div id="text-container">
                                        <yt-formatted-string
                                          id="text"
                                          title="TypeScript Pro"
                                        >
                                          <a
                                            class="yt-simple-endpoint style-scope yt-formatted-string"
                                            href="/@TypeScriptPro"
                                            >TypeScript Pro</a
                                          >
                                        </yt-formatted-string>
                                      </div>
                                    </div>
                                  </ytd-channel-name>
                                </div>
                              </div>
                              <div id="menu">
                                <ytd-menu-renderer>
                                  <button aria-label="Action menu">⋮</button>
                                </ytd-menu-renderer>
                              </div>
                            </div>
                          </div>
                        </ytd-video-renderer>

                        <!-- Search Video Tile 2 -->
                        <ytd-video-renderer
                          class="style-scope ytd-item-section-renderer"
                        >
                          <div
                            id="dismissible"
                            class="style-scope ytd-video-renderer"
                          >
                            <ytd-thumbnail
                              class="style-scope ytd-video-renderer"
                            >
                              <a
                                id="thumbnail"
                                class="yt-simple-endpoint inline-block style-scope ytd-thumbnail"
                                href="/watch?v=searchVid002"
                              >
                                <span
                                  class="ytd-thumbnail-overlay-time-status-renderer"
                                  >18:30</span
                                >
                              </a>
                            </ytd-thumbnail>
                            <div
                              class="text-wrapper style-scope ytd-video-renderer"
                            >
                              <div id="meta">
                                <div id="title-wrapper">
                                  <h3
                                    class="title-and-badge style-scope ytd-video-renderer"
                                  >
                                    <a
                                      id="video-title"
                                      class="yt-simple-endpoint style-scope ytd-video-renderer"
                                      title="10 Tips for Writing Reliable Unit Tests"
                                      href="/watch?v=searchVid002"
                                    >
                                      10 Tips for Writing Reliable Unit Tests
                                    </a>
                                  </h3>
                                </div>
                                <div
                                  id="channel-info"
                                  class="style-scope ytd-video-renderer"
                                >
                                  <ytd-channel-name
                                    id="channel-name"
                                    class="style-scope ytd-video-renderer"
                                  >
                                    <div id="container">
                                      <div id="text-container">
                                        <yt-formatted-string
                                          id="text"
                                          title="Testing HQ"
                                        >
                                          <a
                                            class="yt-simple-endpoint style-scope yt-formatted-string"
                                            href="/@TestingHQ"
                                            >Testing HQ</a
                                          >
                                        </yt-formatted-string>
                                      </div>
                                    </div>
                                  </ytd-channel-name>
                                </div>
                              </div>
                              <div id="menu">
                                <ytd-menu-renderer>
                                  <button aria-label="More actions">⋮</button>
                                </ytd-menu-renderer>
                              </div>
                            </div>
                          </div>
                        </ytd-video-renderer>
                      </div>
                    </ytd-item-section-renderer>
                  </div>
                </ytd-section-list-renderer>
              </div>
            </ytd-two-column-search-results-renderer>
          </div>
        </ytd-search>
      </div>
    </ytd-app>
  </body>
</html>
